openapi: 3.1.0
info:
  title: Utilities Node API
  version: 1.0.0
  summary: API do projeto utilities-node.
  description: |
    API do utilities-node. A autorização é baseada em features armazenadas
    no usuário. Algumas rotas são públicas; outras exigem uma sessão válida
    e/ou uma feature específica.

    O cadastro envia um e-mail de ativação. Contas não ativadas não podem
    criar sessões. Sessões têm validade de 30 dias e são renovadas pelo
    endpoint GET /api/v1/user.

    Erros seguem o formato { name, message, action, status_code }.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://utilities-node.vercel.app
    description: Produção (Vercel)
  - url: http://localhost:3000
    description: Desenvolvimento local

tags:
  - name: Status
    description: Verificação da saúde do banco de dados.
  - name: Migrations
    description: Consulta e aplicação de migrations; exige permissões administrativas.
  - name: Users
    description: Cadastro, consulta pública e atualização autorizada de usuários.
  - name: Admin
    description: Administração de usuários e permissões; exige privilégios administrativos.
  - name: Activations
    description: Ativação de cadastro por token enviado por e-mail.
  - name: Sessions
    description: Criação, consulta e encerramento de sessões.

paths:
  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Verifica a saúde da aplicação
      description: |
        Rota pública. Retorna informações de conexão do banco.
        A versão do PostgreSQL só é incluída quando o usuário autenticado
        possui a feature read:status:all. A feature read:status não é exigida
        pelo endpoint. Quando a requisição traz um cookie session_id inválido
        ou expirado, ele é removido e a consulta continua como visitante anônimo.
      responses:
        "200":
          description: Aplicação conseguiu consultar o banco.
          headers:
            Set-Cookie:
              description: Se o cookie recebido for inválido ou expirado, limpa session_id.
              schema:
                type: string
              example: session_id=invalid; Max-Age=-1; Path=/; HttpOnly; SameSite=Lax
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                publico:
                  value:
                    updated_at: "2026-11-16T13:06:00.000Z"
                    dependencies:
                      database:
                        max_connections: 100
                        opened_connections: 1
                privilegiado:
                  value:
                    updated_at: "2026-11-16T13:06:00.000Z"
                    dependencies:
                      database:
                        version: "16.0"
                        max_connections: 100
                        opened_connections: 1
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/migrations:
    get:
      tags: [Migrations]
      operationId: listPendingMigrations
      summary: Lista migrations pendentes
      description: Exige a feature read:migration. Executa em modo dry-run e não altera o banco.
      x-required-feature: read:migration
      responses:
        "200":
          description: Lista de migrations pendentes; array vazio significa que o banco está atualizado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Migration"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Migrations]
      operationId: runMigrations
      summary: Aplica migrations pendentes
      description: Exige a feature create:migration. Em produção, a execução deve ser feita após o deploy que introduz a migration.
      x-required-feature: create:migration
      responses:
        "201":
          description: Uma ou mais migrations foram aplicadas.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/Migration"
        "200":
          description: Não havia migrations pendentes.
          content:
            application/json:
              schema:
                type: array
                maxItems: 0
                items:
                  $ref: "#/components/schemas/Migration"
              example: []
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Outra execução de migrations já está em andamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Cadastra um usuário
      description: |
        Exige create:user, concedida ao visitante padrão. Cria a conta com
        read:activation_token, gera um token de ativação e envia um e-mail.
        Username, e-mail e senha são validados antes da criação. A senha tem
        de 12 a 64 caracteres, exige pelo menos 2 letras minúsculas, 2 maiúsculas,
        2 números e 2 caracteres especiais e rejeita termos comuns conhecidos.
        Ela é armazenada com HMAC-SHA256 e bcrypt. O e-mail enviado é um efeito
        colateral necessário para concluir o cadastro.
      x-required-feature: create:user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
            example:
              username: jhow
              email: jhow@example.com
              password: uma frase-senha longa e exclusiva
      responses:
        "201":
          description: Usuário criado e e-mail de ativação enviado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
              example:
                id: 5c5b0c0e-2f6e-4a39-9a4a-0d0d9d0a6f10
                username: jhow
                features: [read:activation_token]
                created_at: "2026-11-16T13:06:00.000Z"
                updated_at: "2026-11-16T13:06:00.000Z"
        "400":
          $ref: "#/components/responses/Validation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{username}:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      tags: [Users]
      operationId: getUser
      summary: Consulta a representação pública de um usuário
      description: Rota pública. A resposta não inclui e-mail nem hash da senha.
      responses:
        "200":
          description: Usuário encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Atualiza um usuário
      description: |
        Exige update:user. O usuário pode alterar a própria conta; para
        atualizar outra conta também é necessária a feature update:user:others.
        O corpo deve ser um objeto JSON e pode conter somente username, email
        e password. Campos adicionais/protegidos e corpos que não sejam
        objetos retornam ValidationError (400). Apenas os campos enviados
        são alterados. A resposta é a representação pública do usuário.
      x-required-feature: update:user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
            example:
              email: novo@example.com
      responses:
        "200":
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: searchAdminUsers
      summary: Pesquisa usuários para administração
      description: |
        Exige sessão válida e a feature update:user:others.
        Pesquisa por trecho de username ou e-mail, sem diferenciar maiúsculas
        de minúsculas. Retorna até dez resultados, pode incluir a própria conta do administrador e nunca inclui hash de senha.
      x-required-feature: update:user:others
      security:
        - SessionCookie: []
      parameters:
        - name: search
          in: query
          required: true
          description: Trecho do nome de usuário ou e-mail; mínimo de dois caracteres.
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Usuários encontrados.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/users/{username}:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      tags: [Admin]
      operationId: getAdminUser
      summary: Consulta os dados administrativos de um usuário
      description: Exige sessão válida e update:user:others. Inclui e-mail e features, mas nunca o hash da senha.
      x-required-feature: update:user:others
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Dados administrativos do usuário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Admin]
      operationId: updateAdminUser
      summary: Atualiza dados e permissões de um usuário
      description: Exige update:user:others e permite alterar qualquer conta, inclusive a própria conta do administrador. Aceita também profile_photo como Data URL de imagem JPEG, PNG ou WebP estática, até 2 MB e dimensões entre 128 e 2048 pixels. A lista de features enviada substitui as permissões atuais e só aceita valores do catálogo da aplicação.
      x-required-feature: update:user:others
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Usuário atualizado, sem hash de senha.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/users/{username}/ban:
    parameters:
      - $ref: "#/components/parameters/Username"
    post:
      tags: [Admin]
      operationId: banAdminUser
      summary: Bane uma conta
      description: Exige sessão válida, update:user:status e read:user:others. Não permite auto banimento. Expira sessões e registra o evento na mesma transação.
      x-required-feature: update:user:status
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Conta banida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Admin]
      operationId: unbanAdminUser
      summary: Remove o banimento de uma conta
      description: Exige sessão válida, update:user:status e read:user:others. Não reativa sessões antigas.
      x-required-feature: update:user:status
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Conta desbanida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/users/{username}/photo:
    parameters:
      - $ref: "#/components/parameters/Username"
    delete:
      tags: [Admin]
      operationId: deleteAdminUserPhoto
      summary: Remove a foto de perfil de um usuário
      description: Exige sessão válida e as features update:user:others e read:user:others. Remove a referência no banco e solicita a exclusão do ativo no Cloudinary.
      x-required-feature: update:user:others
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Foto de perfil removida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/audit/banned:
    get:
      tags: [Admin]
      operationId: listBanAuditEvents
      summary: Consulta eventos de banimento e desbanimento
      description: Exige sessão válida e read:audit. Retorna snapshots em ordem cronológica decrescente; resposta com Cache-Control no-store.
      x-required-feature: read:audit
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Eventos de auditoria.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [
                      id,
                      action,
                      username,
                      email,
                      account_created_at,
                      created_at,
                      is_currently_banned,
                    ]
                  properties:
                    id: { type: string, format: uuid }
                    user_id: { type: [string, "null"], format: uuid }
                    actor_user_id: { type: [string, "null"], format: uuid }
                    action: { type: string, enum: [ban, unban] }
                    username: { type: string }
                    email: { type: string, format: email }
                    account_created_at: { type: string, format: date-time }
                    actor_username: { type: [string, "null"] }
                    actor_email: { type: [string, "null"], format: email }
                    created_at: { type: string, format: date-time }
                    is_currently_banned: { type: boolean }
                    current_banned_at:
                      { type: [string, "null"], format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/audit/migrations:
    get:
      tags: [Admin]
      operationId: listMigrationAuditEvents
      summary: Consulta o histórico de migrations aplicadas
      description: Exige sessão válida e read:audit. Retorna os registros da tabela pgmigrations em ordem cronológica decrescente.
      x-required-feature: read:audit
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Histórico de migrations aplicadas.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, run_on]
                  properties:
                    id:
                      type: integer
                      description: Identificador sequencial do registro.
                    name:
                      type: string
                      description: Nome da migration registrada.
                    run_on:
                      type: string
                      format: date-time
                      description: Data e hora em que a migration foi aplicada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/activations/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        description: UUID do token recebido no e-mail de ativação.
        schema:
          type: string
          format: uuid
    patch:
      tags: [Activations]
      operationId: activateUser
      summary: Ativa uma conta
      description: |
        Exige read:activation_token. O token expira em 15 minutos e só pode
        ser utilizado uma vez. O consumo do token e a ativação acontecem na mesma
        transação. A ativação concede create:session, read:session
        e update:user ao usuário.
      x-required-feature: read:activation_token
      responses:
        "200":
          description: Conta ativada e token marcado como utilizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationToken"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Token inexistente, expirado ou já utilizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Autentica e cria uma sessão
      description: |
        Exige create:session. A conta precisa estar ativada. A sessão dura
        30 dias. O token é enviado somente no cookie HttpOnly session_id e não
        aparece no corpo da resposta. Um cookie session_id inválido ou expirado
        na requisição é ignorado (visitante anônimo). O corpo deve ser um objeto
        JSON com email e password como strings não vazias; corpo ausente, null,
        array, valor primitivo, campo ausente, vazio ou com tipo incorreto
        retorna ValidationError (400). Espaços no início e no fim do e-mail
        são removidos antes da consulta. Credenciais incorretas retornam uma
        mensagem genérica, sem distinguir e-mail inexistente de senha errada.
      x-required-feature: create:session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Sessão criada.
          headers:
            Set-Cookie:
              description: Cookie session_id; em produção inclui Secure.
              schema:
                type: string
              example: session_id=<token>; Max-Age=2592000; Path=/; HttpOnly; SameSite=Lax
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Encerra a sessão atual
      description: |
        Exige uma sessão válida no cookie session_id. Antecipada a expiração
        do registro no banco, o cookie é removido do navegador com Max-Age=-1.
        O registro da sessão não é apagado fisicamente. A resposta não inclui o
        token da sessão encerrada.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Sessão encerrada.
          headers:
            Set-Cookie:
              description: Cookie session_id inválido e expirado no navegador.
              schema:
                type: string
              example: session_id=invalid; Max-Age=-1; Path=/; HttpOnly; SameSite=Lax
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user:
    get:
      tags: [Sessions]
      operationId: getAuthenticatedUser
      summary: Consulta o usuário autenticado
      description: |
        Exige uma sessão válida e a feature read:session. Sem cookie, o
        visitante anônimo não possui a feature e recebe 403. Com sessão
        inválida ou expirada, recebe 401. Renova a validade da sessão para
        mais 30 dias, atualiza o cookie e retorna os dados privados do próprio
        usuário, sem senha.
      x-required-feature: read:session
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Dados do usuário autenticado.
          headers:
            Set-Cookie:
              description: Cookie de sessão renovado por mais 30 dias.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: Token da sessão, definido pelo endpoint de login.
  headers:
    NoStore:
      description: Impede o armazenamento em cache da resposta.
      schema:
        type: string
      example: no-store, no-cache, max-age=0, must-revalidate
  parameters:
    Username:
      name: username
      in: path
      required: true
      description: Nome de usuário; a busca não diferencia maiúsculas de minúsculas.
      schema:
        type: string
        maxLength: 30
      example: jhow
  schemas:
    StatusResponse:
      type: object
      required: [updated_at, dependencies]
      properties:
        updated_at:
          type: string
          format: date-time
        dependencies:
          type: object
          required: [database]
          properties:
            database:
              type: object
              required: [max_connections, opened_connections]
              properties:
                version:
                  type: string
                  description: Presente somente quando o usuário possui read:status:all.
                max_connections:
                  type: integer
                opened_connections:
                  type: integer
    Migration:
      type: object
      required: [path, name, timestamp]
      properties:
        path:
          type: string
        name:
          type: string
        timestamp:
          type: integer
          format: int64
    UserCreate:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_-]+$"
        email:
